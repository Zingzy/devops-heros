apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        # Runs inside the cluster so kube-proxy spreads requests over every ready pod.
        - "while true; do wget -q -O- http://yatri-backend-service/healthz > /dev/null; done"
