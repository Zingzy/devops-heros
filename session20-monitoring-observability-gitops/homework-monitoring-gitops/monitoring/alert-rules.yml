groups:
  - name: demo-app
    rules:
      - alert: DemoAppUnhealthy
        expr: demo_app_healthy == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "demo-app /health is returning 503"

      - alert: DemoAppDown
        expr: up{job="demo-app"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape demo-app"

      - alert: HostHighCpu
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85% for 1 minute"

      - alert: HostHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90% for 1 minute"
