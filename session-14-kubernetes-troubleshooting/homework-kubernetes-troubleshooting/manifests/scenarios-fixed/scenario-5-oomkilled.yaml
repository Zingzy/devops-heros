apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  restartPolicy: OnFailure
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-u"
        - "-c"
        - |
          print("Processing 100 chunks of 10 MiB, one at a time...")
          total = 0
          for i in range(100):
              chunk = b"x" * (10 * 1024 * 1024)
              total += len(chunk)
              del chunk
          print(f"Processed {total // (1024 * 1024)} MiB")
          with open("/sys/fs/cgroup/memory.peak") as f:
              print(f"Peak memory: {int(f.read()) // (1024 * 1024)} MiB")
      resources:
        requests:
          memory: "48Mi"
        limits:
          memory: "64Mi"
