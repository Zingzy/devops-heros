apiVersion: v1
kind: ConfigMap

metadata:
  name: app-config

data:
  LOG_LEVEL: info
  APP_PORT: "8080"

---
apiVersion: v1
kind: Pod

metadata:
  name: config-demo

spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "LOG_LEVEL=$LOG_LEVEL APP_MODE=$APP_MODE DB_PASSWORD set: ${DB_PASSWORD:+yes}"
          sleep 3600
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MODE
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: password
